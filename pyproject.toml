[project]
name = "ataraxia"
version = "0.1.0"
description = "Serverless orchestration engine for backtesting quantitative trading strategies"
keywords = [
  "backtesting",
  "quant",
  "quantitative-trading",
  "finance",
  "data-pipeline",
]
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Michal Sitarz" }]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "commitizen>=4.19.0",
    "debugpy>=1.8.22",
    "prek>=0.5.3",
    "pyrefly>=1.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "rumdl==0.2.78",
    "ruff>=0.16.8",
    "tach>=0.35.1",
]

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

# CI reads this pin too; see CONTRIBUTING.md for the toolchain update policy.
[tool.uv]
required-version = "==0.12.19"

[tool.rumdl]
line-length = 80
extend-enable = ["MD060"]
respect-gitignore = true
force-exclude = true
cache-dir = ".cache/rumdl"
exclude = [
    "CHANGELOG.md",
    ".git/**",
    "**/.git/**",
    ".venv/**",
    "**/.venv/**",
    ".cache/**",
    "**/.cache/**",
    ".pytest_cache/**",
    "**/.pytest_cache/**",
    ".ruff_cache/**",
    "**/.ruff_cache/**",
    "build/**",
    "**/build/**",
    "dist/**",
    "**/dist/**",
    "htmlcov/**",
    "**/htmlcov/**",
    "site/**",
    "**/site/**",
    "node_modules/**",
    "**/node_modules/**",
    "**/__pycache__/**",
]

[tool.rumdl.MD013]
line-length = 80
reflow = true
code-blocks = false
code-spans = false
headings = false
tables = false
ignore-link-urls = true

[tool.rumdl.MD051]
anchor-style = "github"

[tool.rumdl.MD057]
absolute-links = "ignore"

[tool.rumdl.MD060]
enabled = true
style = "compact"

[project.scripts]
ataraxia = "ataraxia.cli:main"

# =============================================================================
# ruff (linting & formatting)
# =============================================================================
[tool.ruff]
preview = true
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes — unused imports, undefined names, etc.
  "I",    # isort — import ordering (replaces standalone isort)
  "UP",   # pyupgrade — modernise syntax: Optional[X] → X | None, etc.
  "B",    # flake8-bugbear — mutable defaults, loop variable leakage, etc.
  "SIM",  # flake8-simplify — redundant conditions, unnecessary dicts, etc.
  "C4",   # flake8-comprehensions — prefer list/dict/set comprehensions
  "TID",  # flake8-tidy-imports — ban relative imports beyond one level
  "RUF",  # ruff-native rules — various Python 3 improvements
  "D",    # pydocstyle - presence and formatting of docstrings
  "DOC",  # pydoclint - args/returns match signature in docstrings
  "T20",  # flake8-print - no stray print statements
]
extend-ignore = [
  "undocumented-magic-method",
  "undocumented-public-init",
]
extend-select = ["too-many-statements"] # Ruff PLR0915 statement count
ignore = [
  "missing-trailing-comma",                    # REQUIRED: conflicts with ruff format
  "single-line-implicit-string-concatenation", # REQUIRED: conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
# Intentional boundary fixture; tests copy it outside this exact exemption.
"test/make/fixtures/size_51.py" = ["too-many-statements"]
"src/ataraxia/cli.py" = ["T20"]    # print allowed in CLI code

"test/**" = [
  "assert",   # assert is idiomatic in pytest
  "ANN",      # no need for type annotations in tests
  "D",        # no need for pydocstyle in tests
  "DOC",      # No need for pydoclint in tests
]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# Lint blocks above 50; Make adds an advisory-only pass above 25.
max-statements = 50

[tool.ruff.lint.isort]
known-first-party = ["ataraxia"]
force-sort-within-sections = true

# =============================================================================
# pyrefly (typecheck, lsp)
# =============================================================================
[tool.pyrefly]
project_includes = [
  "src",
  "script",
  "test",
  "example",
]
project_excludes = ["test/ataraxia/typecheck/**"]
search_path = ["src", ".", "test/ataraxia/fixtures/backtest", "script"]
python_version = "3.14"
preset = "strict"

# =============================================================================
# pytest
# =============================================================================
[tool.pytest]
pythonpath = ["src", "."]
testpaths = ["test"]
markers = [
  "covers(work, ac): trace a test to an acceptance criterion.",
  "real_tool: Make integration test invoking a real uv-managed tool.",
]
addopts = [
  "--strict-markers",
  "--tb=short",
  "--import-mode=importlib",
]

# =============================================================================
# pytest-cov (coverage)
# =============================================================================
[tool.coverage.run]
branch = true
source = ["src/ataraxia"]
omit = [
  "src/ataraxia/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
  "raise NotImplementedError",
  "\\.\\.\\.\\s*$",           # ellipsis stub bodies (Protocols, overloads)
]

# =============================================================================
# commitizen (conventional commits & version management)
# =============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
changelog_incremental = true
update_changelog_on_bump = true
annotated_tag = true
pre_bump_hooks = ["script/commitizen_pre_bump_hook.sh"]
